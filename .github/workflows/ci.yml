name: CI & Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Astro typecheck & diagnostics
        run: npm run check

      - name: Build static production bundle
        run: npm run build

      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=high || true
